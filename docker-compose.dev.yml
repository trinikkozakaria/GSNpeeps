# Overlay development: menjalankan backend dan frontend dari source code host,
# bukan dari binary/static assets yang sudah dibangun ke dalam image.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# docker-compose.yml sendirian tetap menghasilkan mode produksi/staging berbasis binary.
name: gsnpeeps

services:
  nginx:
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    # Tag terpisah agar build produksi tidak menimpa image dev, dan sebaliknya.
    image: gsnpeeps-frontend-dev
    build:
      context: ./frontend
      target: dev
    expose:
      - "5173"
    environment:
      # Docker Desktop di Windows memerlukan polling untuk perubahan bind mount.
      # Interval 1 detik menjaga HMR responsif tanpa membebani event loop Vite.
      VITE_USE_POLLING: "true"
      VITE_POLLING_INTERVAL_MS: "1000"
    volumes:
      - ./frontend:/app
      # node_modules dipakai milik image; jangan tertimpa isi host yang mungkin
      # dibangun untuk platform berbeda.
      - frontend-node-modules:/app/node_modules

  # Seluruh service Go memakai satu image dev yang sama. Perintah yang dijalankan
  # ditentukan environment TARGET saat runtime, bukan oleh binary yang dibangun ke image.
  backend-api:
    image: &backend-dev-image gsnpeeps-backend-dev
    build: &backend-dev-build
      context: ./backend
      target: dev
      args:
        TARGET: api
    environment:
      # Browser E2E melakukan banyak login role berbeda dari satu alamat container.
      # Lockout akun tetap 5 kegagalan; hanya batas agregat per IP test yang dilonggarkan.
      AUTH_LOGIN_RATE_LIMIT: "100"
    volumes: &backend-dev-volumes
      - ./backend:/src
      - go-build-cache:/root/.cache/go-build
      - go-module-cache:/go/pkg/mod
    # The base stack keeps application services on an isolated network. In
    # development Air may need to download modules after go.mod changes, so
    # attach an additional network with outbound access without weakening the
    # production configuration.
    networks: &backend-dev-networks
      - internal
      - dev-egress
    healthcheck:
      # Kompilasi pertama berjalan saat container start, jadi beri waktu lebih panjang.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s

  cron-worker:
    image: *backend-dev-image
    build: *backend-dev-build
    environment:
      TARGET: worker
    volumes: *backend-dev-volumes
    networks: *backend-dev-networks

  migrate:
    image: *backend-dev-image
    build: *backend-dev-build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec goose -dir /src/migrations postgres "$$DATABASE_URL" up'
    volumes:
      - ./backend/migrations:/src/migrations:ro

  seed:
    image: *backend-dev-image
    build: *backend-dev-build
    entrypoint: []
    command: ["go", "run", "./cmd/seed"]
    volumes: *backend-dev-volumes
    networks: *backend-dev-networks

networks:
  dev-egress:

volumes:
  frontend-node-modules:
  go-build-cache:
  go-module-cache:
