name: gsnpeeps

services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "8080"
    networks:
      - internal
    restart: unless-stopped

  backend-api:
    build:
      context: ./backend
      args:
        TARGET: api
    environment: &backend-environment
      APP_ENV: "${APP_ENV:-development}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      HTTP_ADDRESS: ":8080"
      HTTP_TRUST_PROXY: "true"
      CORS_ALLOWED_ORIGIN: "${CORS_ALLOWED_ORIGIN:-http://localhost:8080}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-gsnpeeps}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gsnpeeps}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      JWT_TTL: "8h"
      AUTH_LOGIN_RATE_LIMIT: "${AUTH_LOGIN_RATE_LIMIT:-10}"
      NEXTCLOUD_WEBDAV_URL: "http://nextcloud:80/remote.php/dav/files/${NEXTCLOUD_ADMIN_USER:-gsnpeeps-service}"
      NEXTCLOUD_USERNAME: "${NEXTCLOUD_ADMIN_USER:-gsnpeeps-service}"
      NEXTCLOUD_APP_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}"
      NEXTCLOUD_ROOT_FOLDER: "GSNpeeps"
      SEED_PASSWORD: "${SEED_PASSWORD:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nextcloud:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  cron-worker:
    build:
      context: ./backend
      args:
        TARGET: worker
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      args:
        TARGET: api
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /usr/local/bin/goose -dir /migrations postgres "$$DATABASE_URL" up'
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-gsnpeeps}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gsnpeeps}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  seed:
    profiles: ["tools"]
    build:
      context: ./backend
      args:
        TARGET: seed
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-gsnpeeps}"
      POSTGRES_USER: "${POSTGRES_USER:-gsnpeeps}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gsnpeeps} -d ${POSTGRES_DB:-gsnpeeps}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  nextcloud:
    image: nextcloud:31-apache
    environment:
      NEXTCLOUD_ADMIN_USER: "${NEXTCLOUD_ADMIN_USER:-gsnpeeps-service}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}"
      NEXTCLOUD_TRUSTED_DOMAINS: "nextcloud"
      # Memicu instalasi otomatis pada first start. Tanpa backend database ini,
      # endpoint WebDAV hanya mengarahkan request ke halaman setup HTML.
      SQLITE_DATABASE: "nextcloud"
    volumes:
      - nextcloud-data:/var/www/html
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "php occ status --output=json | grep -q '\"installed\":[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
      - internal
    restart: unless-stopped

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres-data:
  redis-data:
  nextcloud-data:
