openapi: 3.1.0
info:
  title: GSNpeeps API
  version: 0.7.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Kontrak HTTP GSNpeeps untuk Employee Database, dashboard HR, absensi,
    approval, notifikasi, dan administrasi akses.

    API menggunakan field JSON `snake_case`, Bearer JWT berumur 8 jam, dan
    cross-check sesi aktif di Redis. Tidak ada refresh-token endpoint.
  contact:
    name: GSNpeeps IT Liaison
servers:
  - url: http://{host}:{port}
    description: Development
    variables:
      host:
        default: localhost
      port:
        default: "8080"
  - url: https://{host}
    description: Production
    variables:
      host:
        default: api.janjikupadamu.id
tags:
  - name: System
    description: Health dan readiness service.
  - name: Authentication
    description: Login, self-reset, current-user, change-password, logout, JWT, dan Redis session.
  - name: Master Organization
    description: Master departemen, jabatan, dan lokasi kantor aktif untuk referensi.
  - name: Employees
    description: Database karyawan Point 1-12 dan dokumen.
  - name: My Profile
    description: Profil dan metrik pribadi user aktif.
  - name: Dashboard
    description: Metrik agregat untuk HR dan Top Management.
  - name: Attendance
    description: Pencatatan dan live feed absensi.
  - name: Attendance Reports
    description: Laporan serta ekspor kehadiran.
  - name: Leave Requests
    description: Pengajuan ketidakhadiran dan alur approval.
  - name: Leave Types
    description: Master jenis izin serta kuota tahunan.
  - name: Overtime
    description: Pengajuan, approval, dan rekap lembur.
  - name: Access Administration
    description: Role, permission, dan audit log.
  - name: Notifications
    description: |
      Notifikasi personal dalam aplikasi. Untuk kontrak yang akan berakhir tepat H-30,
      worker mengirim ke atasan aktif bila ada dan semua HR aktif selain subjek; bila
      tidak ada HR eligible, worker memakai satu-satunya Top Management aktif.
security:
  - BearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Periksa kesehatan service
      description: |
        Liveness/readiness probe untuk API, PostgreSQL, dan Redis.
        Endpoint publik dan tidak memerlukan autentikasi.
      tags: [System]
      security: []
      responses:
        "200":
          description: Service dan dependency sehat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Login ke GSNpeeps
      description: |
        Login publik menggunakan email dan password. Setelah lima kegagalan
        berturut-turut akun dikunci dan menghasilkan `ACCOUNT_LOCKED`.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Kredensial tidak valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value:
                    success: false
                    error:
                      code: INVALID_CREDENTIALS
                      message: Email atau password tidak valid
        "429":
          description: Akun terkunci setelah lima kegagalan login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accountLocked:
                  value:
                    success: false
                    error:
                      code: ACCOUNT_LOCKED
                      message: Akun terkunci dan memerlukan pemulihan
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Logout dari GSNpeeps
      description: |
        Menghapus session key Redis sehingga JWT aktif langsung ditolak.
        Berlaku untuk seluruh role dan dicatat pada Audit Log.
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Ambil identitas user aktif
      description: |
        Mengembalikan identitas dan role berdasarkan JWT serta session aktif di Redis.
        Tidak memperpanjang masa token.
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Identitas user aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/me/password:
    patch:
      operationId: changeCurrentUserPassword
      summary: Ganti password user aktif
      description: |
        User terautentikasi mengganti password sendiri memakai password saat ini.
        Operasi mencabut seluruh session dan mereset counter lockout; user harus login
        kembali. HR hanya melihat status akun yang telah diperbarui, tidak pernah password.
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password berhasil diganti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/me/foto:
    put:
      operationId: updateMyPhoto
      summary: Perbarui foto profil sendiri
      description: |
        Tersedia untuk seluruh role terautentikasi, termasuk Top Management yang tidak
        memiliki Profil Saya, karena navbar menampilkan foto untuk seluruh role. File
        diteruskan backend ke Nextcloud; database hanya menyimpan locator (D-037).
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUploadRequest"
      responses:
        "200":
          description: Foto profil berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpdateResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/FileTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFileType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/reset-password:
    post:
      operationId: resetOwnPassword
      summary: Pulihkan password sendiri
      description: |
        Self-service untuk karyawan, termasuk akun yang terkunci. Request memverifikasi
        email dan password saat ini sebelum menerima password baru. Jika berhasil, password
        hash diperbarui, lockout/counter dibersihkan, seluruh session dicabut, status akun
        yang dilihat HR otomatis terbarui, dan audit dicatat tanpa nilai password.
        Endpoint memakai pesan kegagalan generik serta rate limit gabungan per akun dan IP;
        kegagalan verifikasi ikut dicatat pada counter agar endpoint tidak melewati proteksi
        brute-force login. Endpoint tidak mengirim email/OTP dan tidak menangani password
        yang terlupa.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfResetPasswordRequest"
      responses:
        "200":
          description: Password berhasil direset; user harus login kembali.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Email atau password saat ini tidak valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/master/departemen:
    get:
      operationId: listDepartments
      summary: Ambil master departemen
      description: Dropdown organisasi read-only untuk seluruh role terautentikasi.
      tags: [Master Organization]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar departemen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/master/jabatan:
    get:
      operationId: listPositions
      summary: Ambil master jabatan
      description: Dropdown jabatan read-only untuk seluruh role terautentikasi.
      tags: [Master Organization]
      security:
        - BearerAuth: []
      parameters:
        - name: department_id
          in: query
          required: false
          description: Filter jabatan berdasarkan departemen.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Daftar jabatan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/master/lokasi-kantor:
    get:
      operationId: listOfficeLocations
      summary: Ambil master lokasi kantor
      description: |
        Dropdown lokasi WFO untuk seluruh role terautentikasi. Karyawan bebas memilih
        kantor aktif tempat ia hadir; tidak ada assignment kantor permanen. Response dapat
        kosong sampai data lokasi resmi tersedia.
      tags: [Master Organization]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar lokasi kantor aktif dengan koordinat tepercaya.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeLocationListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/karyawan:
    get:
      operationId: listEmployees
      summary: Ambil daftar karyawan
      description: |
        HR dan Top Management dapat membaca seluruh karyawan. Top Management
        read-only. Karyawan dan Atasan mendapat `403 FORBIDDEN`.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: department_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Daftar karyawan terfilter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createEmployee
      summary: Tambah karyawan
      description: |
        Hanya HR. Membuat employee beserta data administratif awal dalam satu
        transaksi dan mencatat perubahan pada Audit Log. Akun login dibuat
        terkunci dengan kredensial acak yang tidak pernah dikembalikan; aktivasi
        menunggu kanal verifikasi resmi.
      tags: [Employees]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Karyawan berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email, NIP, nomor KTP, atau nomor kontrak sudah digunakan; atau struktur organisasi tidak sesuai.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicateEmployee:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Data unik karyawan sudah digunakan
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/karyawan/export:
    get:
      operationId: exportEmployees
      summary: Export data karyawan
      description: |
        Hanya HR. Mengekspor list sesuai filter atau detail satu karyawan tanpa
        watermark. Aktivitas download dicatat pada Audit Log.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExportFormatParam"
        - name: id
          in: query
          required: false
          description: Jika diberikan, export detail satu karyawan.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/SearchParam"
        - name: department_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
      responses:
        "200":
          description: File XLSX atau PDF.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/karyawan/{id}:
    get:
      operationId: getEmployee
      summary: Ambil detail karyawan
      description: HR dan Top Management dapat membaca; Top Management read-only.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200":
          description: Detail lengkap karyawan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateEmployee
      summary: Perbarui karyawan
      description: |
        Hanya HR. Walaupun menggunakan PUT, API Contract menetapkan partial
        update; seluruh field request opsional. Perubahan dicatat pada Audit Log.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Karyawan berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deactivateEmployee
      summary: Nonaktifkan karyawan
      description: Hanya HR. Soft-delete dengan status `nonaktif`; tidak menghapus histori.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200":
          description: Karyawan berhasil dinonaktifkan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/karyawan/{id}/dokumen:
    post:
      operationId: uploadEmployeeDocument
      summary: Unggah dokumen karyawan
      description: |
        Hanya HR. File diteruskan backend ke Nextcloud; database hanya menyimpan
        locator. Format: PDF, DOC/DOCX, XLS/XLSX, PPT/PPTX, JPG, PNG; maksimal 5 MB.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EmployeeDocumentUploadRequest"
      responses:
        "201":
          description: Dokumen berhasil diunggah.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFileType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listEmployeeDocuments
      summary: Ambil dokumen karyawan
      description: |
        HR dan Top Management dapat membaca dokumen seluruh karyawan; Top
        Management read-only. Karyawan dan Atasan tidak memiliki akses Point 12.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200":
          description: Daftar dokumen karyawan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/karyawan/{id}/foto:
    put:
      operationId: updateEmployeePhoto
      summary: Perbarui foto profil karyawan
      description: |
        Hanya HR. Karyawan/atasan memperbarui foto sendiri melalui
        `PUT /auth/me/foto`, bukan endpoint ini (D-037). File diteruskan backend ke
        Nextcloud; database hanya menyimpan locator.
      tags: [Employees]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUploadRequest"
      responses:
        "200":
          description: Foto profil berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpdateResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/FileTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFileType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/profil/saya:
    get:
      operationId: getMyProfile
      summary: Ambil profil sendiri
      description: |
        Karyawan, Atasan, dan HR membaca Point 1-11 milik sendiri. Data read-only
        di endpoint ini dan gaji hanya periode bulan berjalan.
      tags: [My Profile]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil user yang sedang login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/profil/saya/metrik:
    get:
      operationId: getMyMetrics
      summary: Ambil metrik personal
      description: |
        Saldo cuti, lama kerja, dan riwayat clock milik Karyawan, Atasan, atau HR
        yang login. Top Management mendapat `403 FORBIDDEN`.
      tags: [My Profile]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Metrik personal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalMetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/dashboard/metrik:
    get:
      operationId: getDashboardMetrics
      summary: Ambil dashboard metrik HR
      description: |
        Hanya HR yang dapat membaca. Kehadiran valid membutuhkan clock-in dan clock-out pada
        tanggal yang sama. Check-in setelah pukul 09:00:00 Asia/Jakarta dihitung terlambat;
        tepat pukul 09:00:00 belum terlambat. Karyawan nonaktif dipisahkan dari komposisi
        aktif dan gender kosong masuk kategori `belum_diisi`.
      tags: [Dashboard]
      security:
        - BearerAuth: []
      parameters:
        - name: periode
          in: query
          required: false
          description: Granularitas kalender; default bulanan.
          schema:
            $ref: "#/components/schemas/DashboardPeriod"
        - name: tanggal_acuan
          in: query
          required: false
          description: |
            Tanggal dalam periode yang dipilih; default tanggal server di Asia/Jakarta.
            Mingguan memakai Senin-Minggu, bulanan memakai bulan kalender, dan tahunan
            memakai 1 Januari-31 Desember.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Agregasi dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetricsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/absensi/checkin:
    post:
      operationId: recordAttendance
      summary: Catat check-in atau check-out
      description: |
        Karyawan, Atasan, dan HR mencatat absensi milik sendiri. Field `tipe`
        membedakan check-in dan check-out. Hari kerja Senin-Jumat, 09:00-18:00
        Asia/Jakarta. Check-in setelah 09:00 berstatus `terlambat`; checkout sebelum
        18:00 boleh dicatat dengan status `pulang_cepat`. WFO divalidasi maksimal
        100 meter dari kantor aktif yang dipilih. Foto JPG/PNG maksimal 5 MB.
      tags: [Attendance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttendanceCheckRequest"
      responses:
        "201":
          description: Absensi berhasil dicatat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFileType"
        "422":
          description: Aturan bisnis absensi gagal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                outOfRadius:
                  value:
                    success: false
                    error:
                      code: OUT_OF_RADIUS
                      message: Lokasi WFO berada di luar radius kantor
                duplicateCheckIn:
                  value:
                    success: false
                    error:
                      code: DUPLICATE_CHECKIN
                      message: Check-in hari ini sudah tercatat
                checkoutWithoutCheckin:
                  value:
                    success: false
                    error:
                      code: CHECKOUT_WITHOUT_CHECKIN
                      message: Check-out memerlukan check-in aktif
                nonWorkingDay:
                  value:
                    success: false
                    error:
                      code: NON_WORKING_DAY
                      message: Absensi reguler hanya tersedia Senin sampai Jumat
                invalidOfficeLocation:
                  value:
                    success: false
                    error:
                      code: INVALID_OFFICE_LOCATION
                      message: Lokasi kantor WFO tidak valid atau tidak aktif
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/absensi/livefeed:
    get:
      operationId: getAttendanceLiveFeed
      summary: Ambil live feed absensi
      description: |
        HR dan Top Management membaca kehadiran seluruh user pada tanggal
        tertentu. Top Management read-only; Karyawan/Atasan mendapat 403.
      tags: [Attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: tanggal
          in: query
          required: false
          description: Default tanggal server saat ini.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Live feed absensi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceLiveFeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/laporan/kehadiran:
    get:
      operationId: getAttendanceReport
      summary: Ambil laporan kehadiran
      description: |
        HR dan Top Management membaca rekap; Top Management read-only.
        `tanggal_mulai` dan `tanggal_selesai` wajib secara bisnis saat `periode=custom`.
      tags: [Attendance Reports]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AttendancePeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - name: department_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rekap kehadiran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/laporan/kehadiran/export:
    get:
      operationId: exportAttendanceReport
      summary: Export laporan kehadiran
      description: Hanya HR. File tanpa watermark dan aktivitas dicatat pada Audit Log.
      tags: [Attendance Reports]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AttendancePeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - name: department_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ExportFormatParam"
      responses:
        "200":
          description: File laporan XLSX atau PDF.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ketidakhadiran:
    post:
      operationId: createLeaveRequest
      summary: Ajukan ketidakhadiran
      description: |
        Karyawan, Atasan, dan HR mengajukan cuti/izin/perjalanan dinas milik
        sendiri. Dokumen pendukung wajib. Sistem menentukan approver awal menurut
        role/struktur dan membuat notifikasi idempotent untuk approver tersebut.
      tags: [Leave Requests]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequest"
      responses:
        "201":
          description: Pengajuan berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequestCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFileType"
        "422":
          description: Saldo cuti atau kuota jenis izin tidak memenuhi aturan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficientLeaveBalance:
                  value:
                    success: false
                    error:
                      code: INSUFFICIENT_LEAVE_BALANCE
                      message: Saldo cuti tidak mencukupi
                quotaExceeded:
                  value:
                    success: false
                    error:
                      code: QUOTA_EXCEEDED
                      message: Durasi melebihi kuota jenis izin
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listLeaveRequestsForApproval
      summary: Ambil antrean approval ketidakhadiran
      description: |
        Atasan hanya melihat bawahan langsung dan tahap aktifnya. HR hanya melihat
        pengajuan pada kewenangan HR. Top Management hanya melihat pengajuan HR.
      tags: [Leave Requests]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalQueueStatus"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Antrean pengajuan sesuai scope approver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequestListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ketidakhadiran/saya:
    get:
      operationId: listMyLeaveRequests
      summary: Ambil pengajuan ketidakhadiran sendiri
      description: Karyawan, Atasan, dan HR hanya membaca pengajuan milik sendiri.
      tags: [Leave Requests]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Histori pengajuan milik user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequestListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ketidakhadiran/{id}:
    get:
      operationId: getLeaveRequest
      summary: Ambil detail ketidakhadiran
      description: |
        Hanya pemohon atau approver terkait pada scope aktif yang boleh membaca
        detail dan histori approval.
      tags: [Leave Requests]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaveRequestIdPath"
      responses:
        "200":
          description: Detail pengajuan dan histori approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequestDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ketidakhadiran/{id}/decision:
    put:
      operationId: decideLeaveRequest
      summary: Putuskan pengajuan ketidakhadiran
      description: |
        Atasan memutuskan pengajuan bawahan langsung pada tahap Atasan; HR
        memutuskan tahap HR; Top Management hanya memutuskan pengajuan HR.
        Perubahan membuat notifikasi pemohon dan approver tahap berikutnya jika ada.
      tags: [Leave Requests]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaveRequestIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Keputusan berhasil disimpan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pengajuan telah diputuskan, didelegasikan, atau di-escalate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyDecided:
                  value:
                    success: false
                    error:
                      code: ALREADY_DECIDED
                      message: Pengajuan sudah diproses
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ketidakhadiran/{id}/delegate:
    put:
      operationId: delegateLeaveRequest
      summary: Delegasikan approval ketidakhadiran
      description: |
        Atasan terkait mendelegasikan tahap aktif ke HR. Sistem mencatat histori
        delegasi dan membuat notifikasi idempotent untuk HR serta pemohon.
      tags: [Leave Requests]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaveRequestIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegateRequest"
      responses:
        "200":
          description: Delegasi berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pengajuan tidak lagi dapat didelegasikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyDecided:
                  value:
                    success: false
                    error:
                      code: ALREADY_DECIDED
                      message: Pengajuan sudah diproses
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

