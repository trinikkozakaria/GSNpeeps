              schema:
                $ref: "#/components/schemas/IdSuccessResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/akses/role:
    get:
      operationId: listRoles
      summary: Daftar role
      description: HR dan Top Management membaca empat role sistem; Top Management read-only.
      tags: [Access Administration]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/akses/permission:
    get:
      operationId: getPermissionMatrix
      summary: Ambil matriks permission
      description: HR dan Top Management membaca permission per role; Top Management read-only.
      tags: [Access Administration]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Matriks permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionMatrixResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: updatePermission
      summary: Perbarui permission role
      description: Hanya HR. Perubahan permission wajib dicatat pada Audit Log.
      tags: [Access Administration]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionRequest"
      responses:
        "200":
          description: Permission berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdSuccessResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/akses/audit-log:
    get:
      operationId: listAuditLogs
      summary: Daftar audit log
      description: |
        HR dan Top Management membaca audit log yang sudah direduksi; Top Management
        read-only. Audit log append-only dan tidak memiliki mutation API.
      tags: [Access Administration]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - name: aksi
          in: query
          schema: { type: string }
        - name: modul
          in: query
          schema: { type: string }
        - name: user_id
          in: query
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Daftar audit log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifikasi:
    get:
      operationId: listNotifications
      summary: Daftar notifikasi
      description: Mengembalikan notifikasi milik user yang sedang login.
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: is_read
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Daftar notifikasi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifikasi/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Hitung notifikasi belum dibaca
      description: Menghitung notifikasi milik user aktif yang belum dibaca dan belum di-dismiss.
      tags: [Notifications]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Jumlah notifikasi belum dibaca.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifikasi/{id}/read:
    put:
      operationId: markNotificationRead
      summary: Tandai notifikasi telah dibaca
      description: Hanya pemilik notifikasi.
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdPath"
      responses:
        "200":
          description: Notifikasi ditandai telah dibaca.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdSuccessResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifikasi/{id}:
    delete:
      operationId: deleteNotification
      summary: Hapus notifikasi
      description: Hanya pemilik notifikasi. Penghapusan tidak menghapus audit log.
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdPath"
      responses:
        "200":
          description: Notifikasi berhasil dihapus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSuccessResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token berlaku 8 jam. Backend juga memverifikasi session aktif di
        Redis pada setiap request terproteksi.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    SearchParam:
      name: search
      in: query
      schema: { type: string, maxLength: 100 }
    EmployeeIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    LeaveRequestIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    LeaveTypeIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    OvertimeRequestIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    NotificationIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    DateFromParam:
      name: tanggal_mulai
      in: query
      schema: { type: string, format: date }
    DateToParam:
      name: tanggal_selesai
      in: query
      schema: { type: string, format: date }
    AttendancePeriodParam:
      name: periode
      in: query
      description: Bulan laporan.
      schema: { $ref: "#/components/schemas/YearMonth" }
    ExportFormatParam:
      name: format
      in: query
      description: Format berkas export sesuai API Contract v1.1; lihat keputusan D-017.
      schema:
        type: string
        enum: [xlsx, pdf]
        default: xlsx
    RequestStatusParam:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/RequestStatus" }
    DepartmentIdQuery:
      name: departemen_id
      in: query
      schema: { $ref: "#/components/schemas/UUID" }

  responses:
    BadRequest:
      description: Request atau parameter tidak valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            invalidRequest:
              value:
                success: false
                error: { code: INVALID_REQUEST, message: Request tidak valid }
    Unauthorized:
      description: Kredensial tidak ada, tidak valid, atau kedaluwarsa.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            unauthorized:
              value:
                success: false
                error: { code: UNAUTHORIZED, message: Autentikasi diperlukan }
    Forbidden:
      description: User tidak memiliki kewenangan atau akses row-level.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            forbidden:
              value:
                success: false
                error: { code: FORBIDDEN, message: Akses ditolak }
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            notFound:
              value:
                success: false
                error: { code: NOT_FOUND, message: Data tidak ditemukan }
    Conflict:
      description: Konflik state atau data duplikat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            conflict:
              value:
                success: false
                error: { code: CONFLICT, message: Data sudah ada atau sudah diproses }
    ValidationError:
      description: Validasi bisnis atau field gagal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            validation:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Validasi gagal
                  fields: { tanggal_mulai: Tanggal mulai wajib diisi }
    FileTooLarge:
      description: File melebihi batas 5 MB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            fileTooLarge:
              value:
                success: false
                error: { code: FILE_TOO_LARGE, message: Ukuran file maksimal 5 MB }
    UnsupportedFileType:
      description: Tipe file tidak didukung.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            unsupported:
              value:
                success: false
                error: { code: UNSUPPORTED_FILE_TYPE, message: Tipe file tidak didukung }
    TooManyRequests:
      description: Rate limit terlampaui atau akun terkunci sementara.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            rateLimited:
              value:
                success: false
                error: { code: RATE_LIMITED, message: Terlalu banyak request }
    InternalError:
      description: Kesalahan internal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            internal:
              value:
                success: false
                error: { code: INTERNAL_ERROR, message: Terjadi kesalahan internal }
    ServiceUnavailable:
      description: Dependency penting belum sehat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            unavailable:
              value:
                success: false
                error: { code: SERVICE_UNAVAILABLE, message: Layanan belum siap }

  schemas:
    UUID:
      type: string
      format: uuid
      example: 0193f406-8d2f-7d0c-bf34-61ff192e46de
    YearMonth:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: 2026-07
    RoleName:
      type: string
      enum: [karyawan, atasan, hr, top_management]
    EmployeeStatus:
      type: string
      enum: [aktif, nonaktif]
      description: Cuti tetap termasuk aktif; resign dipetakan ke nonaktif.
    RequestStatus:
      type: string
      description: Enum machine-readable yang digunakan sama pada database, query, dan response.
      enum: [menunggu_atasan, menunggu_hr, menunggu_top_management, disetujui, ditolak, dibatalkan]
    ApprovalQueueStatus:
      type: string
      enum: [menunggu_atasan, menunggu_hr, menunggu_top_management]
    DashboardPeriod:
      type: string
      enum: [harian, mingguan, bulanan, tahunan]
      default: bulanan
    WorkMode:
      type: string
      enum: [WFO, WFH, WFA]
    AttendanceType:
      type: string
      enum: [check_in, check_out]
    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        message: { type: string }
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: Validasi gagal }
        fields:
          $ref: "#/components/schemas/ValidationFields"
    ValidationFields:
      type: object
      additionalProperties: { type: string }
      example: { email: Format email tidak valid }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: "#/components/schemas/ErrorObject" }
    PaginationMeta:
      type: object
      required: [page, limit, total_data, total_page]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total_data: { type: integer, minimum: 0 }
        total_page: { type: integer, minimum: 0 }
    IdData:
      type: object
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
    IdSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/IdData" }
    RequestStateData:
      type: object
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/RequestStatus" }
    LeaveRequestCreateResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/RequestStateData" }
    DecisionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/RequestStateData" }
    DeleteSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: "null" }
            message: { type: string, example: Data berhasil dihapus }
    FileUploadData:
      type: object
      required: [id, file_url]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        file_url:
          type: string
          format: uri
          description: Locator file terkontrol; bukan kredensial Nextcloud.
          example: https://files.example.test/employee-documents/document.pdf
    FileUploadResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FileUploadData" }
    HealthData:
      type: object
      required: [status, db, redis]
      properties:
        status: { type: string, enum: [ok] }
        db: { type: string, enum: [ok] }
        redis: { type: string, enum: [ok] }
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/HealthData" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    AuthUser:
      type: object
      required: [id, employee_id, nama, email, role, foto_profil_url]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        employee_id: { $ref: "#/components/schemas/UUID" }
        nama: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/RoleName" }
        foto_profil_url: { type: [string, "null"], format: uri }
    LoginData:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token: { type: string, example: eyJhbGciOiJIUzI1NiJ9.example.signature }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 28800 }
        user: { $ref: "#/components/schemas/AuthUser" }
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LoginData" }
    AuthMeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AuthUser" }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Harus berbeda dari password saat ini.
        new_password_confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Harus sama dengan new_password.
    SelfResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, current_password, new_password, new_password_confirmation]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        current_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Harus berbeda dari password saat ini.
        new_password_confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Harus sama dengan new_password.
    PasswordChangedData:
      type: object
      required: [password_changed, account_locked, sessions_revoked]
      properties:
        password_changed: { type: boolean, const: true }
        account_locked: { type: boolean, const: false }
        sessions_revoked: { type: boolean, const: true }
    PasswordChangedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PasswordChangedData" }
            message: { type: string, example: Password berhasil diganti }
    Department:
      type: object
      required: [id, nama]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        nama: { type: string, maxLength: 100 }
    Position:
      type: object
      required: [id, department_id, nama]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        department_id: { $ref: "#/components/schemas/UUID" }
        nama: { type: string, maxLength: 100 }
    OfficeLocation:
      type: object
      required: [id, kode, nama, latitude, longitude, is_active]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kode: { type: string, maxLength: 50 }
        nama: { type: string, maxLength: 150 }
        alamat:
          type: [string, "null"]
          description: Dapat dilengkapi setelah data alamat kantor resmi tersedia.
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        is_active: { type: boolean }
    DepartmentListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Department" } }
    PositionListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Position" } }
    OfficeLocationListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/OfficeLocation" } }
    EmployeeAddress:
      type: object
      required: [jalan, kota, provinsi]
      properties:
        jalan: { type: string, maxLength: 255 }
        kelurahan: { type: [string, "null"], maxLength: 100 }
        kecamatan: { type: [string, "null"], maxLength: 100 }
        kota: { type: string, maxLength: 100 }
        provinsi: { type: string }
    EmployeeKTP:
      type: object
      required: [nomor_ktp]
      properties:
        nomor_ktp: { type: string, maxLength: 20 }
        file_url: { type: [string, "null"], format: uri }
    EmployeeContract:
      type: object
      required: [nomor_kontrak, jenis_kontrak, tanggal_mulai, tanggal_berakhir, status]
      properties:
        nomor_kontrak: { type: string, maxLength: 50 }
        jenis_kontrak: { type: string, enum: [PKWT, PKWTT] }
        tanggal_mulai: { type: string, format: date }
        tanggal_berakhir: { type: string, format: date }
        file_url: { type: [string, "null"], format: uri }
        status: { type: string, enum: [aktif, berakhir] }
    EmployeeAddressInput:
      type: object
      additionalProperties: false
      required: [jalan, kota, provinsi]
      properties:
        jalan: { type: string, minLength: 1, maxLength: 255 }
        kelurahan: { type: [string, "null"], maxLength: 100 }
        kecamatan: { type: [string, "null"], maxLength: 100 }
        kota: { type: string, minLength: 1, maxLength: 100 }
        provinsi: { type: string, minLength: 1, maxLength: 100 }
    EmployeeKTPInput:
      type: object
      additionalProperties: false
      required: [nomor_ktp]
      properties:
        nomor_ktp: { type: string, pattern: '^\d{16}$' }
    EmployeeContractInput:
      type: object
      additionalProperties: false
      required: [nomor_kontrak, jenis_kontrak, tanggal_mulai, tanggal_berakhir]
      properties:
        nomor_kontrak: { type: string, minLength: 1, maxLength: 50 }
        jenis_kontrak: { type: string, enum: [PKWT, PKWTT] }
        tanggal_mulai: { type: string, format: date }
        tanggal_berakhir: { type: string, format: date }
    EmployeeBPJS:
      type: object
      properties:
        jenis: { type: string, enum: [kesehatan, ketenagakerjaan] }
        nomor: { type: string }
        status: { type: string, enum: [aktif, nonaktif] }
    EmployeeNPWP:
      type: object
      properties:
        nomor_npwp: { type: string }
        status_ptkp: { type: string }
        file_url: { type: [string, "null"], format: uri }
    EmergencyContact:
      type: object
      properties:
        nama: { type: string }
        hubungan: { type: string }
        nomor_telepon: { type: string }
        is_primary: { type: boolean }
    EducationHistory:
      type: object
      properties:
        jenjang: { type: string }
        institusi: { type: string }
        jurusan: { type: string }
        tahun_lulus: { type: integer, minimum: 1900, maximum: 2200 }
    PositionHistory:
      type: object
      properties:
        departemen: { $ref: "#/components/schemas/Department" }
        jabatan: { $ref: "#/components/schemas/Position" }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: [string, "null"], format: date }
    CurrentSalary:
      type: object
      properties:
        periode: { $ref: "#/components/schemas/YearMonth" }
        gaji_pokok: { type: number, format: double, minimum: 0 }
        tunjangan: { type: number, format: double, minimum: 0 }
        potongan: { type: number, format: double, minimum: 0 }
        take_home_pay: { type: number, format: double }
    EmployeeBPJSInput:
      type: object
      additionalProperties: false
      description: |
        Satu employee menyimpan satu baris `employee_bpjs`; kedua nomor bersifat opsional
        dan independen. Dokumen pendukung BPJS diunggah melalui
        `POST /karyawan/{id}/dokumen` dengan `jenis_dokumen` bebas (mis. "BPJS"), bukan
        field ini.
      properties:
        nomor_kesehatan: { type: [string, "null"], maxLength: 20 }
        nomor_ketenagakerjaan: { type: [string, "null"], maxLength: 20 }
    EmployeeNPWPInput:
      type: object
      additionalProperties: false
      required: [nomor_npwp]
      description: |
        Dokumen pendukung NPWP diunggah melalui `POST /karyawan/{id}/dokumen`, bukan field
        ini.
      properties:
        nomor_npwp: { type: string, minLength: 1, maxLength: 25 }
    EmergencyContactInput:
      type: object
      additionalProperties: false
      required: [nama, nomor_telepon]
      properties:
        nama: { type: string, minLength: 1, maxLength: 150 }
        hubungan: { type: [string, "null"], maxLength: 50 }
        nomor_telepon: { type: string, minLength: 1, maxLength: 20 }
    EducationHistoryInput:
      type: object
      additionalProperties: false
      properties:
        jenjang: { type: [string, "null"], maxLength: 20 }
        institusi: { type: [string, "null"], maxLength: 150 }
        tahun_lulus: { type: [integer, "null"], minimum: 1900, maximum: 2200 }
    PositionHistoryInput:
      type: object
      additionalProperties: false
      required: [tanggal_mulai]
      description: |
        Label jabatan pada riwayat diturunkan server dari `position_id` saat penulisan,
        bukan dikirim client.
      properties:
        department_id:
          oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }]
        position_id:
          oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }]
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: [string, "null"], format: date }
    CurrentSalaryInput:
      type: object
      additionalProperties: false
      required: [periode, gaji_pokok]
      description: |
        Upsert per `(employee_id, periode)`. `take_home_pay` selalu dihitung server
        (`gaji_pokok + tunjangan - potongan`) dan tidak pernah diterima dari client.
      properties:
        periode: { $ref: "#/components/schemas/YearMonth" }
        gaji_pokok: { type: number, format: double, minimum: 0 }
        tunjangan: { type: number, format: double, minimum: 0 }
        potongan: { type: number, format: double, minimum: 0 }
    EmployeeDocument:
      type: object
      required: [id, jenis_dokumen, nama_file, file_url, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        jenis_dokumen: { type: string }
        nama_file: { type: string }
        file_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
    EmployeeSummary:
      type: object
      required: [id, nip, nama, email, departemen, jabatan, status]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        nip: { type: string }
        nama: { type: string }
        email: { type: string, format: email }
        departemen: { type: string }
        jabatan: { type: string }
        status: { $ref: "#/components/schemas/EmployeeStatus" }
    EmployeeDetail:
      allOf:
        - $ref: "#/components/schemas/EmployeeSummary"
        - type: object
          properties:
            foto_profil_url: { type: [string, "null"], format: uri }
            jenis_kelamin:
              type: string
              enum: [L, P]
              description: Wajib diisi; L=laki-laki, P=perempuan.
            tanggal_lahir: { type: string, format: date }
            tanggal_join: { type: string, format: date }
            department_id:
              oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }]
            position_id:
              oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }]
            atasan_id: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
            status_pernikahan:
              type: [string, "null"]
              enum: [lajang, menikah, cerai, null]
            alamat:
              oneOf: [{ $ref: "#/components/schemas/EmployeeAddress" }, { type: "null" }]
            ktp:
              oneOf: [{ $ref: "#/components/schemas/EmployeeKTP" }, { type: "null" }]
            kontrak: { type: array, items: { $ref: "#/components/schemas/EmployeeContract" } }
            bpjs: { type: array, items: { $ref: "#/components/schemas/EmployeeBPJS" } }
            npwp: { $ref: "#/components/schemas/EmployeeNPWP" }
            kontak_darurat: { type: array, items: { $ref: "#/components/schemas/EmergencyContact" } }
            pendidikan: { type: array, items: { $ref: "#/components/schemas/EducationHistory" } }
            riwayat_jabatan: { type: array, items: { $ref: "#/components/schemas/PositionHistory" } }
            gaji_berjalan: { $ref: "#/components/schemas/CurrentSalary" }
    CreateEmployeeRequest:
      type: object
      additionalProperties: false
      required:
        [nip, nama, email, jenis_kelamin, tanggal_lahir, tanggal_join,
         department_id, position_id, role, alamat, ktp, kontrak]
      properties:
        nip: { type: string, minLength: 1, maxLength: 20 }
        nama: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 150 }
        jenis_kelamin: { type: string, enum: [L, P] }
        tanggal_lahir: { type: string, format: date }
        tanggal_join: { type: string, format: date }
        department_id: { $ref: "#/components/schemas/UUID" }
        position_id: { $ref: "#/components/schemas/UUID" }
        atasan_id: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
        status_pernikahan: { type: string, enum: [lajang, menikah, cerai] }
        role: { $ref: "#/components/schemas/RoleName" }
        alamat: { $ref: "#/components/schemas/EmployeeAddressInput" }
        ktp: { $ref: "#/components/schemas/EmployeeKTPInput" }
        kontrak: { $ref: "#/components/schemas/EmployeeContractInput" }
        bpjs: { $ref: "#/components/schemas/EmployeeBPJSInput" }
        npwp: { $ref: "#/components/schemas/EmployeeNPWPInput" }
        kontak_darurat:
          type: array
          items: { $ref: "#/components/schemas/EmergencyContactInput" }
        pendidikan:
          type: array
          items: { $ref: "#/components/schemas/EducationHistoryInput" }
        riwayat_jabatan:
          type: array
          items: { $ref: "#/components/schemas/PositionHistoryInput" }
        gaji_berjalan: { $ref: "#/components/schemas/CurrentSalaryInput" }
    UpdateEmployeeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Semua field bersifat opsional; PUT ini menggunakan partial update sesuai kontrak.
        `kontak_darurat`, `pendidikan`, dan `riwayat_jabatan` memakai semantik replace-all:
        bila disertakan (termasuk array kosong), seluruh baris lama diganti set yang
        dikirim karena kontrak tidak membawa identitas baris individual untuk patch
        granular.
      properties:
        nama: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 150 }
        jenis_kelamin: { type: string, enum: [L, P] }
        tanggal_lahir: { type: string, format: date }
        tanggal_join: { type: string, format: date }
        department_id: { $ref: "#/components/schemas/UUID" }
        position_id: { $ref: "#/components/schemas/UUID" }
        atasan_id: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
        role: { $ref: "#/components/schemas/RoleName" }
        status: { $ref: "#/components/schemas/EmployeeStatus" }
        status_pernikahan: { type: string, enum: [lajang, menikah, cerai] }
        bpjs: { $ref: "#/components/schemas/EmployeeBPJSInput" }
        npwp: { $ref: "#/components/schemas/EmployeeNPWPInput" }
        kontak_darurat:
          type: array
          items: { $ref: "#/components/schemas/EmergencyContactInput" }
        pendidikan:
          type: array
          items: { $ref: "#/components/schemas/EducationHistoryInput" }
        riwayat_jabatan:
          type: array
          items: { $ref: "#/components/schemas/PositionHistoryInput" }
        gaji_berjalan: { $ref: "#/components/schemas/CurrentSalaryInput" }
    EmployeeDocumentUploadRequest:
      type: object
      required: [jenis_dokumen, file]
      properties:
        jenis_dokumen: { type: string, maxLength: 100 }
        file:
          type: string
          format: binary
          description: Maksimal 5 MB; format sesuai deskripsi endpoint.
    PhotoUploadRequest:
      type: object
      required: [foto]
      properties:
        foto:
          type: string
          format: binary
          description: JPG atau PNG; maksimal 5 MB.
    PhotoUpdateData:
      type: object
      required: [foto_profil_url]
      properties:
        foto_profil_url: { type: string, format: uri }
    PhotoUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PhotoUpdateData" }
    EmployeeListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required: [meta]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/EmployeeSummary" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    EmployeeDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/EmployeeDetail" }
    EmployeeDocumentListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/EmployeeDocument" } }
    MyProfileResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/EmployeeDetail" }
    ClockHistory:
      type: object
      properties:
        tanggal: { type: string, format: date }
        check_in: { type: [string, "null"], format: time }
        check_out: { type: [string, "null"], format: time }
        status: { type: string }
    PersonalMetrics:
      type: object
      required: [periode, hadir, terlambat, izin, total_lembur_jam, riwayat_absensi]
      properties:
        periode: { $ref: "#/components/schemas/YearMonth" }
        hadir: { type: integer, minimum: 0 }
        terlambat: { type: integer, minimum: 0 }
        izin: { type: integer, minimum: 0 }
        total_lembur_jam: { type: number, minimum: 0 }
        riwayat_absensi: { type: array, items: { $ref: "#/components/schemas/ClockHistory" } }
    PersonalMetricsResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PersonalMetrics" }
    NamedCount:
      type: object
      required: [nama, jumlah]
      properties:
        nama: { type: string }
        jumlah: { type: integer, minimum: 0 }
    DashboardPeriodRange:
      type: object
      required: [tipe, tanggal_mulai, tanggal_selesai, timezone]
      properties:
        tipe: { $ref: "#/components/schemas/DashboardPeriod" }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date }
        timezone: { type: string, const: Asia/Jakarta }
    GenderCount:
      type: object
      required: [kategori, jumlah]
      properties:
        kategori:
          type: string
          enum: [laki_laki, perempuan, belum_diisi]
        jumlah: { type: integer, minimum: 0 }
    OrganizationNode:
      type: object
      required: [employee_id, nama, departemen, jabatan, bawahan]
      properties:
        employee_id: { $ref: "#/components/schemas/UUID" }
        nama: { type: string }
        departemen: { type: string }
        jabatan: { type: string }
        bawahan:
          type: array
          items: { $ref: "#/components/schemas/OrganizationNode" }
    DashboardMetrics:
      type: object
      required:
        [periode, total_karyawan, karyawan_aktif, karyawan_nonaktif, karyawan_baru,
         resign, turnover_rate, hadir_valid, terlambat, hari_izin_disetujui,
         estimasi_biaya_payroll, pengajuan_menunggu, komposisi_departemen_aktif,
         komposisi_departemen_nonaktif, rasio_gender, organization_chart]
      properties:
        periode: { $ref: "#/components/schemas/DashboardPeriodRange" }
        total_karyawan: { type: integer, minimum: 0 }
        karyawan_aktif:
          type: integer
          minimum: 0
          description: Status aktif dan cuti pada akhir periode.
        karyawan_nonaktif:
          type: integer
          minimum: 0
          description: Status nonaktif dan resign pada akhir periode.
        karyawan_baru:
          type: integer
          minimum: 0
          description: Tanggal masuk berada dalam rentang periode.
        resign:
          type: integer
          minimum: 0
          description: Status resign dengan deleted_at berada dalam rentang periode.
        turnover_rate:
          type: number
          format: double
          minimum: 0
          description: Resign dibagi rata-rata headcount awal/akhir periode dikali 100; nol bila denominator nol.
        hadir_valid:
          type: integer
          minimum: 0
          description: Jumlah pasangan unik employee/tanggal yang memiliki clock-in dan clock-out dalam rentang periode.
        terlambat:
          type: integer
          minimum: 0
          description: Subset hadir_valid dengan waktu server setelah 09:00:00 Asia/Jakarta.
        hari_izin_disetujui:
          type: integer
          minimum: 0
          description: Total irisan hari Senin-Jumat dari izin final disetujui dalam periode.
        estimasi_biaya_payroll:
          type: number
          format: double
          minimum: 0
          description: |
            Sum alokasi take_home_pay bulanan berdasarkan proporsi hari kerja Senin-Jumat
            yang beririsan dengan periode; belum memperhitungkan kalender libur.
        pengajuan_menunggu: { type: integer, minimum: 0 }
        komposisi_departemen_aktif:
          type: array
          description: Status aktif dan cuti pada akhir periode.
          items: { $ref: "#/components/schemas/NamedCount" }
        komposisi_departemen_nonaktif:
          type: array
          description: Status nonaktif dan resign pada akhir periode.
          items: { $ref: "#/components/schemas/NamedCount" }
        rasio_gender:
          type: array
          description: |
            Hanya populasi aktif/cuti pada akhir periode. Gender wajib untuk data baru;
            data legacy kosong masuk belum_diisi dan tidak dihitung sebagai laki_laki/perempuan.
          items: { $ref: "#/components/schemas/GenderCount" }
        organization_chart:
          type: array
          description: Pohon aktif/cuti pada akhir periode berdasarkan atasan_id; root tidak memiliki atasan aktif.
          items: { $ref: "#/components/schemas/OrganizationNode" }
    DashboardMetricsResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/DashboardMetrics" }
    Attendance:
      type: object
      required: [id, employee_id, tanggal, tipe, mode_kerja, waktu, status]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        employee_id: { $ref: "#/components/schemas/UUID" }
        tanggal: { type: string, format: date }
        tipe: { $ref: "#/components/schemas/AttendanceType" }
        mode_kerja: { $ref: "#/components/schemas/WorkMode" }
        waktu: { type: string, format: date-time }
        gps_lat: { type: number, minimum: -90, maximum: 90 }
        gps_long: { type: number, minimum: -180, maximum: 180 }
        office_location_id:
          oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }]
          description: Lokasi kantor yang dipilih untuk WFO; null untuk WFH/WFA.
        distance_meters:
          type: [number, "null"]
          minimum: 0
          description: Jarak hasil hitung server untuk WFO; null untuk WFH/WFA.
        foto_url: { type: string, format: uri }
        status: { type: string, enum: [tepat_waktu, terlambat, pulang_cepat, valid] }
    AttendanceCheckRequest:
      type: object
      required: [tipe, mode_kerja, gps_lat, gps_long, foto]
      description: |
        Koordinat wajib untuk seluruh mode. Backend menerapkan radius kantor maksimal
        100 meter hanya ketika mode_kerja=WFO terhadap lokasi kantor aktif yang dipilih;
        WFH dan WFA tetap menyimpan koordinat tetapi tidak menjalankan validasi radius.
      properties:
        tipe: { $ref: "#/components/schemas/AttendanceType" }
        mode_kerja: { $ref: "#/components/schemas/WorkMode" }
        gps_lat: { type: number, minimum: -90, maximum: 90 }
        gps_long: { type: number, minimum: -180, maximum: 180 }
        office_location_id:
          $ref: "#/components/schemas/UUID"
          description: Wajib untuk WFO dan tidak digunakan untuk WFH/WFA.
        foto: { type: string, format: binary, description: JPG/PNG maksimal 5 MB. }
      allOf:
        - if:
            properties:
              mode_kerja: { const: WFO }
            required: [mode_kerja]
          then:
            required: [office_location_id]
    AttendanceCheckResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Attendance" }
    AttendanceLiveFeedItem:
      allOf:
        - $ref: "#/components/schemas/Attendance"
        - type: object
          properties:
            nama_karyawan: { type: string }
            departemen: { type: string }
    AttendanceLiveFeedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/AttendanceLiveFeedItem" } }
    AttendanceReportItem:
      type: object
      required: [employee_id, nama_karyawan, hadir, terlambat, izin, alpha]
      properties:
        employee_id: { $ref: "#/components/schemas/UUID" }
        nama_karyawan: { type: string }
        departemen: { type: string }
        hadir: { type: integer, minimum: 0 }
        terlambat: { type: integer, minimum: 0 }
        izin: { type: integer, minimum: 0 }
        alpha: { type: integer, minimum: 0 }
        total_jam_kerja: { type: number, minimum: 0 }
    AttendanceReportResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required: [meta]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/AttendanceReportItem" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    LeaveType:
      type: object
      required: [id, kode, nama, kuota_tahunan, is_active]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kode: { type: string, maxLength: 50 }
        nama: { type: string, maxLength: 150 }
        kuota_tahunan: { type: integer, minimum: 0 }
        memerlukan_dokumen: { type: boolean }
        is_active: { type: boolean }
    CreateLeaveTypeRequest:
      type: object
      additionalProperties: false
      required: [kode, nama, kuota_tahunan, memerlukan_dokumen]
      properties:
        kode: { type: string, maxLength: 50 }
        nama: { type: string, maxLength: 150 }
        kuota_tahunan: { type: integer, minimum: 0 }
        memerlukan_dokumen: { type: boolean }
    UpdateLeaveTypeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nama: { type: string, maxLength: 150 }
        kuota_tahunan: { type: integer, minimum: 0 }
        memerlukan_dokumen: { type: boolean }
        is_active: { type: boolean }
    LeaveTypeListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/LeaveType" } }
    CreateLeaveRequest:
      type: object
      required: [jenis_izin_id, tanggal_mulai, tanggal_selesai, alasan]
      properties:
        jenis_izin_id: { $ref: "#/components/schemas/UUID" }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date }
        alasan: { type: string, minLength: 10, maxLength: 2000 }
        dokumen_pendukung:
          type: string
          format: binary
          description: Wajib bila master jenis izin mensyaratkannya; maksimal 5 MB.
        lokasi_tujuan:
          type: string
          description: Wajib secara kondisional untuk Perjalanan Dinas.
        keterangan_lokasi:
          type: string
          description: Wajib secara kondisional untuk Perjalanan Dinas.
    ApprovalHistory:
      description: >
        Satu baris riwayat per tahap keputusan. Tahap `top_management` dan keputusan
        `auto_eskalasi` diperlukan oleh alur approval yang ditetapkan PRD; lihat
        keputusan D-025. `approver_id` dan `approver_nama` kosong ketika keputusan
        dipicu sistem melalui auto-escalation.
      type: object
      required: [tahap, keputusan, decided_at]
      properties:
        tahap: { type: string, enum: [atasan, hr, top_management] }
        approver_id:
          oneOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        approver_nama: { type: [string, "null"] }
        keputusan:
          type: string
          enum: [disetujui, ditolak, didelegasikan, auto_eskalasi]
        catatan: { type: [string, "null"] }
        decided_at: { type: string, format: date-time }
    LeaveRequestSummary:
      type: object
      required:
        [id, employee_id, nama_karyawan, jenis_izin, tanggal_mulai,
         tanggal_selesai, jumlah_hari, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        employee_id: { $ref: "#/components/schemas/UUID" }
        nama_karyawan: { type: string }
        jenis_izin: { type: string }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date }
        jumlah_hari: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/RequestStatus" }
        created_at: { type: string, format: date-time }
    LeaveRequestDetail:
      allOf:
        - $ref: "#/components/schemas/LeaveRequestSummary"
        - type: object
          properties:
            alasan: { type: string }
            dokumen_url: { type: [string, "null"], format: uri }
            lokasi_tujuan: { type: [string, "null"] }
            keterangan_lokasi: { type: [string, "null"] }
            approval_history:
              type: array
              items: { $ref: "#/components/schemas/ApprovalHistory" }
    LeaveRequestListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required: [meta]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/LeaveRequestSummary" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    LeaveRequestDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LeaveRequestDetail" }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [keputusan]
      properties:
        keputusan: { type: string, enum: [setujui, tolak] }
        catatan: { type: string, maxLength: 1000 }
      allOf:
        - if:
            properties:
              keputusan: { const: tolak }
          then:
            required: [catatan]
            properties:
              catatan: { minLength: 5 }
    DelegateRequest:
      type: object
      additionalProperties: false
      required: [delegate_to, catatan]
      properties:
        delegate_to: { $ref: "#/components/schemas/UUID" }
        catatan: { type: string, minLength: 5, maxLength: 1000 }
    CreateOvertimeRequest:
      type: object
      required: [tanggal, waktu_mulai, waktu_selesai, alasan]
      properties:
        tanggal: { type: string, format: date }
        waktu_mulai: { type: string, format: time }
        waktu_selesai: { type: string, format: time }
        alasan: { type: string, minLength: 10, maxLength: 2000 }
        dokumen_pendukung: { type: string, format: binary, description: Maksimal 5 MB. }
    OvertimeRequestSummary:
      type: object
      required:
        [id, employee_id, nama_karyawan, tanggal, waktu_mulai, waktu_selesai,
         total_jam, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        employee_id: { $ref: "#/components/schemas/UUID" }
        nama_karyawan: { type: string }
        tanggal: { type: string, format: date }
        waktu_mulai: { type: string, format: time }
        waktu_selesai: { type: string, format: time }
        total_jam: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/RequestStatus" }
        created_at: { type: string, format: date-time }
    OvertimeRequestDetail:
      allOf:
        - $ref: "#/components/schemas/OvertimeRequestSummary"
        - type: object
          properties:
            alasan: { type: string }
            dokumen_url: { type: [string, "null"], format: uri }
            approval_history:
              type: array
              items: { $ref: "#/components/schemas/ApprovalHistory" }
    OvertimeRequestListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required: [meta]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/OvertimeRequestSummary" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    OvertimeRequestDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/OvertimeRequestDetail" }
    OvertimeRecapItem:
      type: object
      required: [employee_id, nama_karyawan, total_pengajuan, total_jam]
      properties:
        employee_id: { $ref: "#/components/schemas/UUID" }
        nama_karyawan: { type: string }
        departemen: { type: string }
        total_pengajuan: { type: integer, minimum: 0 }
        total_jam: { type: number, minimum: 0 }
    OvertimeRecapResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/OvertimeRecapItem" } }
    RoleSummary:
      type: object
      required: [id, nama, deskripsi]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        nama: { $ref: "#/components/schemas/RoleName" }
        deskripsi: { type: string }
    RoleListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/RoleSummary" } }
    Permission:
      type: object
      required: [id, role_id, modul, aksi, is_allowed]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        role_id: { $ref: "#/components/schemas/UUID" }
        modul: { type: string }
        aksi: { type: string, enum: [create, read, update, delete, approve, export] }
        is_allowed: { type: boolean }
    PermissionMatrixResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    UpdatePermissionRequest:
      type: object
      additionalProperties: false
      required: [role_id, modul, aksi, is_allowed]
      properties:
        role_id: { $ref: "#/components/schemas/UUID" }
        modul: { type: string, maxLength: 100 }
        aksi: { type: string, enum: [create, read, update, delete, approve, export] }
        is_allowed: { type: boolean }
    AuditLog:
      type: object
      required: [id, user_id, aksi, modul, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        # Aktor sistem (auto-escalation, scheduler) tidak memiliki user; lihat keputusan D-029.
        user_id: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
        nama_user: { type: [string, "null"] }
        aksi: { type: string }
        modul: { type: string }
        resource_id: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
        detail: { type: [object, "null"], additionalProperties: true }
        ip_address: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    AuditLogListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required: [meta]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    Notification:
      type: object
      required: [id, user_id, tipe, judul, pesan, is_read, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        user_id: { $ref: "#/components/schemas/UUID" }
        tipe:
          type: string
          example: ketidakhadiran_baru
        judul: { type: string }
        pesan: { type: string }
        reference_id: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
        reference_type: { type: [string, "null"] }
        is_read: { type: boolean }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    NotificationListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required: [meta]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    UnreadCountData:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0 }
    UnreadCountResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UnreadCountData" }
