# Konfigurasi Nginx khusus development. Perbedaan dari default.conf:
# - upstream frontend menunjuk ke Vite dev server (port 5173), bukan static assets.
# - websocket upgrade diteruskan agar HMR Vite berfungsi lewat satu origin.
# Jangan dipakai di staging/produksi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gsnpeeps_frontend {
    server frontend:5173;
}

upstream gsnpeeps_api {
    server backend-api:8080;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self)" always;

    location = /health {
        proxy_pass http://gsnpeeps_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # Nginx adalah satu-satunya public ingress. Jangan meneruskan X-Forwarded-For dari
        # client karena backend memercayai hop pertama untuk rate-limit dan audit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://gsnpeeps_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gsnpeeps_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Dev server melakukan on-demand transform; beri ruang lebih lama dari default.
        proxy_read_timeout 300s;
    }
}
